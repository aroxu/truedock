name: "Feature request (English)"
description: "Suggest a new feature or an improvement to existing behavior."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. TrueDock targets TrueNAS SCALE Community Edition 25.10 and later.

        Issues or attachments containing sensitive data may be deleted without notice.
  - type: textarea
    id: problem
    attributes:
      label: "Problem to solve"
      description: "Describe the inconvenience or administration problem this would solve."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed feature"
      description: "Describe the desired behavior and user flow."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Describe any current workaround or alternative solution."
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Overview"
        - "Storage"
        - "Data Protection"
        - "Apps"
        - "System"
        - "App Settings"
        - "Connection and authentication"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add screenshots, TrueNAS API documentation, or examples if useful. Remove sensitive data first."
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I searched existing issues for similar requests."
          required: true
        - label: "This request applies to TrueNAS SCALE Community Edition 25.10 or later."
          required: true
