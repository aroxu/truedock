name: CI

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run linting
        run: |
          python3 tool/arb_lint.py lib/l10n/app_en.arb lib/l10n/app_ko.arb
          flutter analyze

      - name: Run tests
        run: flutter test
